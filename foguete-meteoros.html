<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Foguete vs Meteoros</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0a0e1a;
    overflow: hidden;
    height: 100%;
    touch-action: none;
    font-family: 'Segoe UI', sans-serif;
  }
  #gameContainer {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    background: radial-gradient(ellipse at center, #10182b 0%, #05070d 100%);
    display: block;
    max-width: 100%;
    max-height: 100%;
    touch-action: none;
  }
  #ui {
    position: absolute;
    top: 12px;
    left: 12px;
    color: #e8f0ff;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 0 0 6px rgba(0,0,0,0.8);
    pointer-events: none;
  }
  #shootBtn {
    position: absolute;
    bottom: 24px;
    right: 24px;
    width: 68px;
    height: 68px;
    border-radius: 50%;
    border: none;
    background: radial-gradient(circle at 35% 35%, #ff8a5c, #d9432b);
    color: #fff;
    font-size: 26px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    -webkit-tap-highlight-color: transparent;
  }
  #shootBtn:active { transform: scale(0.92); }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #e8f0ff;
    text-align: center;
    background: rgba(5, 7, 13, 0.75);
  }
  #overlay h1 {
    font-size: 28px;
    margin: 0 0 8px 0;
  }
  #overlay p {
    margin: 4px 0;
    opacity: 0.85;
    font-size: 14px;
  }
  #startBtn {
    margin-top: 18px;
    padding: 12px 28px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, #ff5f6d, #ffc371);
    color: #10182b;
    cursor: pointer;
  }
  #startBtn:active {
    transform: scale(0.96);
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="game" width="400" height="650"></canvas>
  <div id="ui">
    <div>Pontos: <span id="score">0</span></div>
    <div>Vidas: <span id="lives">❤️❤️❤️</span></div>
    <div>Recorde: <span id="best">0</span></div>
  </div>
  <button id="shootBtn">🔫</button>
  <div id="overlay">
    <h1 id="overlayTitle">🚀 Foguete vs Meteoros</h1>
    <p>Arraste o dedo ou use as setas / A-D para desviar</p>
  <p>Botão 🔫 ou barra de espaço para atirar</p>
    <p id="finalScore"></p>
    <button id="startBtn">Jogar</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const finalScoreEl = document.getElementById('finalScore');
const startBtn = document.getElementById('startBtn');
const shootBtn = document.getElementById('shootBtn');

let best = 0;
try {
  best = parseInt(sessionStorage.getItem('rocketBest') || '0', 10) || 0;
} catch(e) { best = 0; }
bestEl.textContent = best;

let rocket, meteors, bullets, score, gameRunning, spawnTimer, speedMult, keys, targetX, shootCooldown, lives, invincible;

function updateLivesUI() {
  livesEl.textContent = '❤️'.repeat(Math.max(lives, 0)) + '🖤'.repeat(3 - Math.max(lives, 0));
}

function resetGame() {
  rocket = { x: W/2, y: H - 80, w: 28, h: 46, vx: 0 };
  targetX = rocket.x;
  meteors = [];
  bullets = [];
  score = 0;
  spawnTimer = 0;
  speedMult = 1;
  keys = {};
  shootCooldown = 0;
  lives = 3;
  invincible = 0;
  gameRunning = true;
  scoreEl.textContent = '0';
  updateLivesUI();
}

function shoot() {
  if (!gameRunning || shootCooldown > 0) return;
  bullets.push({ x: rocket.x, y: rocket.y - 24, vy: -9 });
  shootCooldown = 12;
}

function spawnMeteor() {
  const size = 18 + Math.random() * 28;
  meteors.push({
    x: Math.random() * (W - size) + size/2,
    y: -size,
    r: size/2,
    vy: (1.5 + Math.random() * 2) * speedMult,
    rot: Math.random() * Math.PI * 2,
    vrot: (Math.random() - 0.5) * 0.1
  });
}

function drawRocket(x, y) {
  ctx.save();
  ctx.translate(x, y);
  // flame
  ctx.beginPath();
  ctx.moveTo(-8, 18);
  ctx.lineTo(0, 18 + 14 + Math.random()*8);
  ctx.lineTo(8, 18);
  ctx.closePath();
  const flameGrad = ctx.createLinearGradient(0, 18, 0, 40);
  flameGrad.addColorStop(0, '#ffdd55');
  flameGrad.addColorStop(1, '#ff5522');
  ctx.fillStyle = flameGrad;
  ctx.fill();

  // body
  ctx.beginPath();
  ctx.moveTo(0, -23);
  ctx.quadraticCurveTo(14, -5, 10, 18);
  ctx.lineTo(-10, 18);
  ctx.quadraticCurveTo(-14, -5, 0, -23);
  ctx.closePath();
  const bodyGrad = ctx.createLinearGradient(-10, 0, 10, 0);
  bodyGrad.addColorStop(0, '#c9d6e8');
  bodyGrad.addColorStop(0.5, '#f4f8ff');
  bodyGrad.addColorStop(1, '#9fb0c9');
  ctx.fillStyle = bodyGrad;
  ctx.fill();
  ctx.strokeStyle = '#5a6b85';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // fins
  ctx.beginPath();
  ctx.moveTo(-10, 8);
  ctx.lineTo(-20, 20);
  ctx.lineTo(-9, 18);
  ctx.closePath();
  ctx.moveTo(10, 8);
  ctx.lineTo(20, 20);
  ctx.lineTo(9, 18);
  ctx.closePath();
  ctx.fillStyle = '#ff5f6d';
  ctx.fill();

  // window
  ctx.beginPath();
  ctx.arc(0, -3, 4.5, 0, Math.PI*2);
  ctx.fillStyle = '#3aa0ff';
  ctx.fill();
  ctx.strokeStyle = '#1c4d75';
  ctx.stroke();

  ctx.restore();
}

function drawBullet(b) {
  ctx.save();
  ctx.beginPath();
  ctx.arc(b.x, b.y, 3.5, 0, Math.PI*2);
  const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, 3.5);
  g.addColorStop(0, '#fff9c4');
  g.addColorStop(1, '#ffcc33');
  ctx.fillStyle = g;
  ctx.shadowColor = '#ffcc33';
  ctx.shadowBlur = 8;
  ctx.fill();
  ctx.restore();
}

function drawMeteor(m) {
  ctx.save();
  ctx.translate(m.x, m.y);
  ctx.rotate(m.rot);
  ctx.beginPath();
  const spikes = 8;
  for (let i = 0; i < spikes; i++) {
    const ang = (Math.PI * 2 / spikes) * i;
    const rr = m.r * (0.75 + Math.sin(i * 12.9898) % 1 * 0.25);
    const px = Math.cos(ang) * rr;
    const py = Math.sin(ang) * rr;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  const grad = ctx.createRadialGradient(-m.r*0.3, -m.r*0.3, m.r*0.1, 0, 0, m.r);
  grad.addColorStop(0, '#a9855c');
  grad.addColorStop(1, '#4a3524');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = '#2b1d12';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.restore();
}

let stars = [];
for (let i = 0; i < 70; i++) {
  stars.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.5+0.3, s: Math.random()*0.5+0.15 });
}
function drawStars() {
  ctx.fillStyle = '#fff';
  for (const st of stars) {
    ctx.globalAlpha = 0.5 + Math.sin(Date.now()/500 + st.x) * 0.3;
    ctx.beginPath();
    ctx.arc(st.x, st.y, st.r, 0, Math.PI*2);
    ctx.fill();
    st.y += st.s;
    if (st.y > H) st.y = 0;
  }
  ctx.globalAlpha = 1;
}

function circleRectCollide(cx, cy, r, rx, ry, rw, rh) {
  const closestX = Math.max(rx - rw/2, Math.min(cx, rx + rw/2));
  const closestY = Math.max(ry - rh/2, Math.min(cy, ry + rh/2));
  const dx = cx - closestX, dy = cy - closestY;
  return (dx*dx + dy*dy) < (r*r);
}

function update() {
  if (!gameRunning) return;

  // rocket movement (keyboard)
  const speed = 6;
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) rocket.vx = -speed;
  else if (keys['ArrowRight'] || keys['d'] || keys['D']) rocket.vx = speed;
  else rocket.vx = 0;

  // drag / touch target
  if (targetX !== null) {
    const diff = targetX - rocket.x;
    rocket.x += diff * 0.25;
  } else {
    rocket.x += rocket.vx;
  }
  rocket.x = Math.max(rocket.w/2 + 4, Math.min(W - rocket.w/2 - 4, rocket.x));

  if (keys[' ']) shoot();
  if (shootCooldown > 0) shootCooldown--;
  if (invincible > 0) invincible--;

  spawnTimer++;
  const spawnRate = Math.max(18, 45 - Math.floor(score/8));
  if (spawnTimer > spawnRate) {
    spawnTimer = 0;
    spawnMeteor();
  }

  speedMult = 1 + score * 0.015;

  for (let i = bullets.length - 1; i >= 0; i--) {
    bullets[i].y += bullets[i].vy;
    if (bullets[i].y < -10) bullets.splice(i, 1);
  }

  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.y += m.vy * (1 + score*0.01);
    m.rot += m.vrot;

    let destroyed = false;
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      const dx = b.x - m.x, dy = b.y - m.y;
      if (dx*dx + dy*dy < m.r*m.r) {
        bullets.splice(j, 1);
        meteors.splice(i, 1);
        score += 2;
        scoreEl.textContent = score;
        destroyed = true;
        break;
      }
    }
    if (destroyed) continue;

    if (m.y - m.r > H) {
      meteors.splice(i, 1);
      score++;
      scoreEl.textContent = score;
      continue;
    }
    if (circleRectCollide(m.x, m.y, m.r*0.8, rocket.x, rocket.y, rocket.w, rocket.h)) {
      meteors.splice(i, 1);
      if (invincible <= 0) {
        lives--;
        updateLivesUI();
        invincible = 90;
        if (lives <= 0) {
          endGame();
          return;
        }
      }
      continue;
    }
  }
}

function render() {
  ctx.clearRect(0, 0, W, H);
  drawStars();
  for (const b of bullets) drawBullet(b);
  for (const m of meteors) drawMeteor(m);
  if (invincible <= 0 || Math.floor(invincible / 6) % 2 === 0) {
    drawRocket(rocket.x, rocket.y);
  }
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

function endGame() {
  gameRunning = false;
  if (score > best) {
    best = score;
    try { sessionStorage.setItem('rocketBest', String(best)); } catch(e) {}
  }
  bestEl.textContent = best;
  overlayTitle.textContent = '💥 Fim de jogo';
  finalScoreEl.textContent = 'Você marcou ' + score + ' pontos';
  startBtn.textContent = 'Jogar de novo';
  overlay.classList.remove('hidden');
}

startBtn.addEventListener('click', () => {
  overlay.classList.add('hidden');
  resetGame();
});

window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') e.preventDefault();
  if (e.key !== ' ') targetX = null;
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

shootBtn.addEventListener('touchstart', e => { e.preventDefault(); shoot(); }, { passive: false });
shootBtn.addEventListener('click', () => shoot());

function getCanvasX(clientX) {
  const rect = canvas.getBoundingClientRect();
  return (clientX - rect.left) * (W / rect.width);
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  targetX = getCanvasX(e.touches[0].clientX);
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  targetX = getCanvasX(e.touches[0].clientX);
}, { passive: false });

canvas.addEventListener('mousedown', e => {
  targetX = getCanvasX(e.clientX);
});
canvas.addEventListener('mousemove', e => {
  if (e.buttons === 1) targetX = getCanvasX(e.clientX);
});

resetGame();
gameRunning = false;
render();
requestAnimationFrame(loop);
</script>
</body>
</html>
